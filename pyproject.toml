[project]
name = "maowi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kaylubr", email = "kylebreyes092005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.141.1",
    "google-auth>=2.58.1",
    "google-genai>=2.25.0",
    "passlib[bcrypt]>=1.7.4",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "server"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
